  var h='<label class="filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><span class="fx-sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Filter categories</span><input id="flt" type="search" placeholder="Filter categories" autocomplete="off"></label>';
  D.packs.forEach(function(p){var t=packTotals(p),o=!!open[p.slug];
    h+='<div class="pack" data-pack="'+p.slug+'"><button class="pack-h" aria-expanded="'+o+'" aria-controls="pk-'+p.slug+'">'+CHEV+esc(p.name)+'<span class="n">'+t[0]+' / '+t[1]+'</span></button><div class="pack-body" id="pk-'+p.slug+'"'+(o?'':' hidden')+'>';
    h+='<a class="cat" href="#/'+p.slug+'" data-cat="" style="padding-left:30px">Overview</a>';
    p.groups.forEach(function(g){h+='<div class="grp" data-grp>'+esc(g.name)+'</div>';
      g.cats.forEach(function(c){var b=count(c);h+='<a class="cat'+(b?' built':'')+'" href="#/'+p.slug+'/'+c.slug+'" data-cat="'+esc(c.name.toLowerCase())+'"><span>'+esc(c.name)+'</span><span class="c">'+b+'/'+c.planned+'</span></a>'})});
    h+='</div></div>'});
  $('#side').innerHTML=h;
  $$('.pack-h').forEach(function(b){b.onclick=function(){var o=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',o);b.nextElementSibling.hidden=!o;open[b.parentNode.dataset.pack]=o;localStorage.setItem('fx-open',JSON.stringify(open))}});
  $('#flt').oninput=function(){var q=this.value.trim().toLowerCase();$$('.pack').forEach(function(pk){var any=false;$$('.cat[data-cat]',pk).forEach(function(a){if(!a.dataset.cat){a.hidden=!!q;return}var m=!q||a.dataset.cat.indexOf(q)>=0;a.hidden=!m;any=any||m});
    $$('[data-grp]',pk).forEach(function(gh){var n=gh.nextElementSibling,vis=false;while(n&&n.classList.contains('cat')){if(!n.hidden)vis=true;n=n.nextElementSibling}gh.hidden=!vis});
    if(q){pk.querySelector('.pack-body').hidden=!any;pk.querySelector('.pack-h').setAttribute('aria-expanded',any)}})};
}
function mark(){var h=location.hash||'';$$('.cat').forEach(function(a){a.toggleAttribute('aria-current',a.getAttribute('href')===h);if(a.getAttribute('href')===h)a.setAttribute('aria-current','page')})}
// ---------- previews ----------
function doc(b){return '<!doctype html><ht'+'ml lang="en" class="'+theme+'-theme"><he'+'ad><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"><style>'+CSS+'</style><\/head><bo'+'dy class="fx-canvas"><div class="fx-stage '+(b.stage||'')+'">'+b.html+'</div><script>'+RT+'<\/script><\/body><\/html>'}
function fit(f){try{var d=f.contentDocument,s=d&&d.querySelector('.fx-stage');if(!s)return;var h=Math.max(s.scrollHeight,s.offsetHeight);[].forEach.call(d.querySelectorAll('.fx-menu,.fx-lb-list,.fx-pop'),function(m){var r=m.getBoundingClientRect();if(r.height&&getComputedStyle(m).visibility!=='hidden')h=Math.max(h,Math.ceil(r.bottom+d.documentElement.scrollTop)+40)});if(h>0&&h>=(f._h||0)-0){f._h=h;f.style.height=h+'px'}}catch(e){}}
function mount(f){if(f.dataset.on)return;f.dataset.on=1;var b=f._b;f.onload=function(){fit(f);var d=f.contentDocument;try{new ResizeObserver(function(){fit(f)}).observe(d.querySelector('.fx-stage'))}catch(e){}if(d.fonts)d.fonts.ready.then(function(){fit(f)});setTimeout(function(){fit(f)},400)};f.srcdoc=doc(b)}
var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){mount(e.target);io.unobserve(e.target)}})},{rootMargin:'600px'}):null;
function applyTheme(){$$('.frame').forEach(function(fr){fr.classList.toggle('is-dark',theme==='dark')});$$('.frame iframe').forEach(function(f){try{if(f.contentDocument&&f.contentDocument.documentElement)f.contentDocument.documentElement.className=theme+'-theme'}catch(e){}});
  $$('#theme button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.t===theme)})}
// ---------- views ----------
function overview(p){var t=packTotals(p);var h='<div class="crumb"><a href="#/">Packs</a><span>/</span><span>'+esc(p.name)+'</span></div><h'+'1>'+esc(p.name)+'<\/h1><p class="lede">'+esc(p.blurb)+'</p><div class="chips"><span class="chip'+(t[0]?' ok':'')+'">'+t[0]+' of '+t[1]+' blocks built</span><span class="chip">'+p.groups.reduce(function(a,g){return a+g.cats.length},0)+' categories</span></div>';
  p.groups.forEach(function(g){h+='<h3 class="sec">'+esc(g.name)+'</h3><div class="tiles">';g.cats.forEach(function(c){var b=count(c);h+='<a class="tile'+(b?' built':'')+'" href="#/'+p.slug+'/'+c.slug+'"><strong>'+esc(c.name)+'</strong><span>'+(b?b+' of '+c.planned+' built':c.planned+' planned, coming soon')+'</span><div class="bar"><i style="width:'+Math.round(100*b/c.planned)+'%"></i></div></a>'});h+='</div>'});
  return h}
function home(){var h='<h'+'1>Fundamentals UI Blocks<\/h1><p class="lede">'+esc(D.blurb)+'</p><div class="chips"><span class="chip ok">'+esc(D.stage)+': '+D.built+' blocks</span><span class="chip">'+D.planned+' planned across 3 packs</span></div><div class="tiles" style="margin-top:var(--ds-space-8x)">';
  D.packs.forEach(function(p){var t=packTotals(p);h+='<a class="tile'+(t[0]?' built':'')+'" href="#/'+p.slug+'"><strong>'+esc(p.name)+'</strong><span>'+t[0]+' of '+t[1]+' built</span><div class="bar"><i style="width:'+(100*t[0]/t[1]).toFixed(1)+'%"></i></div></a>'});
  return h+'</div>'}
function category(r){var p=r.p,c=r.c,b=count(c);
  var h='<div class="crumb"><a href="#/'+p.slug+'">'+esc(p.name)+'</a><span>/</span><span>'+esc(r.g.name)+'</span></div><h'+'1>'+esc(c.name)+'<\/h1>';
  h+='<div class="chips"><span class="chip'+(b?' ok':'')+'">'+b+' of '+c.planned+' built</span><span class="chip">Tokens: FILLED '+esc(r.g.tok)+'</span></div>';
  if(!b){return h+'<div class="soon"><h2>Coming soon</h2><p>'+c.planned+' blocks planned for '+esc(c.slice)+'. Leaf names are locked in Catalog v0.</p><ol>'+c.leaves.map(function(l,i){return '<li><b>'+(i+1)+'</b>'+esc(l)+'</li>'}).join('')+'</ol></div>'}
  h+='<div class="blocks">';
  c.built.forEach(function(bk,i){var id=c.slug+'-'+(i+1);
    h+='<section class="blk" id="'+id+'"><div class="blk-h"><div><h2><a href="#/'+p.slug+'/'+c.slug+'/'+id+'">'+esc(bk.name)+'</a></h2><p>'+esc(bk.note)+'</p></div><div class="blk-tools">'+
      '<div class="seg widths" role="group" aria-label="Preview width"><button aria-pressed="true" data-w="">Full</button><button aria-pressed="false" data-w="w-md">768</button><button aria-pressed="false" data-w="w-sm">390</button></div>'+
      '<div class="seg" role="group" aria-label="View"><button aria-pressed="true" data-v="p">Preview</button><button aria-pressed="false" data-v="c">Code</button></div></div></div>'+
      '<div class="frame"><div class="frame-stage"><div class="frame-inner"><iframe title="'+esc(c.name+': '+bk.name)+' preview" loading="lazy" data-i="'+i+'"></iframe></div></div><pre class="code"><code>'+esc(bk.code)+'</code></pre>'+
      '<div class="frame-foot"><span>tokens.css + blocks.css</span><button class="copy" data-i="'+i+'">Copy HTML</button></div></div></section>'});
  if(c.built.length<c.planned){var left=c.leaves.filter(function(l){return !c.built.some(function(x){return x.name===l})});h+='<div class="soon"><h2>Still planned</h2><ol>'+left.map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ol></div>'}
  return h+'</div>'}
function render(){var parts=(location.hash.replace(/^#\/?/,'')||'').split('/'),m=$('#main .wrap'),h;
  if(!parts[0])h=home();else{var r=find(parts[0],parts[1]);if(!r.p)h=home();else if(!r.c)h=overview(r.p);else{h=category(r)}}
  m.innerHTML=h+'<div class="foot">Blocks use only <code>--ds-*</code> tokens generated from tokens.json. Original markup; nothing copied from Tailwind Plus. <a href="'+D.catalog+'">Catalog v0</a> · <a href="'+D.fund+'">Design system</a></div>';
  var r2=parts[1]?find(parts[0],parts[1]):null;
  if(r2&&r2.c){$$('.blk',m).forEach(function(sec){var i=+sec.querySelector('iframe').dataset.i,bk=r2.c.built[i],f=sec.querySelector('iframe'),fr=sec.querySelector('.frame');f._b=bk;fr.classList.toggle('is-dark',theme==='dark');
      if(io)io.observe(f);else mount(f);
      $$('[data-w]',sec).forEach(function(b){b.onclick=function(){$$('[data-w]',sec).forEach(function(x){x.setAttribute('aria-pressed',x===b)});var fi=sec.querySelector('.frame-inner');fi.className='frame-inner '+b.dataset.w;fi.style.width='';f._h=0;setTimeout(function(){fit(f)},300)}});
      $$('[data-v]',sec).forEach(function(b){b.onclick=function(){$$('[data-v]',sec).forEach(function(x){x.setAttribute('aria-pressed',x===b)});fr.classList.toggle('show-code',b.dataset.v==='c')}});
      sec.querySelector('.copy').onclick=function(){var t=this;navigator.clipboard&&navigator.clipboard.writeText(bk.code).then(function(){t.textContent='Copied';setTimeout(function(){t.textContent='Copy HTML'},1500)})}});
    if(parts[2]){var el=document.getElementById(parts[2]);el&&setTimeout(function(){el.scrollIntoView()},50)}}
  if(!parts[2])window.scrollTo(0,0);
  if(parts[0]){var pk=$('.pack[data-pack="'+parts[0]+'"] .pack-h');if(pk&&pk.getAttribute('aria-expanded')!=='true')pk.click()}
  mark();document.body.classList.remove('nav-open');
  document.title=(r2&&r2.c?r2.c.name+' · ':'')+'Fundamentals UI Blocks'}
side();
$$('#theme button').forEach(function(b){b.onclick=function(){theme=b.dataset.t;localStorage.setItem('fx-theme',theme);applyTheme()}});
$('#menu').onclick=function(){document.body.classList.toggle('nav-open')};
window.addEventListener('hashchange',render);render();applyTheme();
})();
